<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>
  <link rel="stylesheet" href="style.css">
  <!-- SweetAlert2 untuk Popup Ucapan Cantik -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="card">
    <div class="img-container">
      <!-- Ganti foto.jpg dengan foto orang yang berulang tahun -->
      <img id="profile-img" src="assets/foto.jpg" alt="Birthday Person">
    </div>
    <h1 id="title">Selamat Ulang Tahun! 🎂</h1>
    <p id="description">Ada pesan spesial nih buat kamu. Klik tombol di bawah ya!</p>
    
    <div class="btn-group">
      <button id="btnUtama" onclick="mulaiPesan()">Buka Pesan ❤️</button>
      <button id="btnLari" onmouseover="kaburButton()">Enggak Mau 😜</button>
    </div>
  </div>

  <!-- Audio Musik Latar -->
  <!-- Ganti musik.mp3 dengan lagu pilihanmu -->
  <audio id="bgm" src="assets/musik.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
